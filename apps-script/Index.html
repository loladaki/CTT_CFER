<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#f4f5f7; --surface:#fff; --surface-2:#eef1f4; --border:#e1e4ea;
    --text:#1a1e26; --text-dim:#5a636f; --accent:#c8102e; --accent-ink:#fff;
    --c-delivered:#1a7f37; --c-returned:#b42318; --c-transit:#1f6feb;
    --c-out:#7a3fd6; --c-pickup:#8a5a00; --c-problem:#bc4c00; --c-reg:#57606a; --c-unknown:#6e7781;
    --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 10px rgba(0,0,0,.05); --radius:12px;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0e1116; --surface:#161b22; --surface-2:#1e242c; --border:#2a2f38;
    --text:#e6e9ee; --text-dim:#9aa4b2; --accent:#ff5a5f; --accent-ink:#12151a;
    --c-delivered:#3fb950; --c-returned:#ff7b72; --c-transit:#58a6ff;
    --c-out:#d2a8ff; --c-pickup:#e3b341; --c-problem:#ffa657; --c-reg:#8b949e; --c-unknown:#6e7781;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }}
  *{box-sizing:border-box;}
  body{margin:0;font:15px/1.55 var(--sans);background:var(--bg);color:var(--text);}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 22px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand h1{font-size:18px;margin:0;font-weight:650;letter-spacing:-.01em;}
  .brand .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);}
  .meta{display:flex;align-items:center;gap:10px;color:var(--text-dim);font-size:13px;}
  .btn{border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px;}
  .btn:hover{background:var(--border);}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
  .btn.add{background:var(--c-delivered);color:#fff;border-color:var(--c-delivered);font-weight:600;}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;width:100%;max-width:420px;box-shadow:0 10px 40px rgba(0,0,0,.3);}
  .modal-box h2{margin:0 0 14px;font-size:18px;}
  .modal-box label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:12px;}
  .modal-box input{display:block;width:100%;margin-top:5px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;}
  .modal-box input:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  .m-msg{min-height:18px;font-size:13px;margin:2px 0 12px;}
  .m-msg.err{color:var(--c-returned);} .m-msg.ok{color:var(--c-delivered);}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;}
  main{max-width:none;margin:0;padding:20px 28px;}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px;}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
  .kpi .n{font-size:30px;font-weight:750;line-height:1;font-variant-numeric:tabular-nums;}
  .kpi .l{color:var(--text-dim);font-size:13px;margin-top:7px;}
  .kpi.alert{border-color:var(--c-returned);} .kpi.alert .n{color:var(--c-returned);}
  .controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:12px;}
  #search{flex:1 1 240px;min-width:180px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-size:14px;}
  #search:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  .filters{display:flex;flex-wrap:wrap;gap:6px;}
  .filters button{border:1px solid var(--border);background:var(--surface);color:var(--text-dim);border-radius:20px;padding:5px 12px;cursor:pointer;font-size:13px;}
  .filters button.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
  .table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow-x:auto;box-shadow:var(--shadow);}
  table{width:100%;border-collapse:collapse;min-width:820px;}
  th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:top;}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim);white-space:nowrap;cursor:pointer;user-select:none;}
  tbody tr:hover{background:var(--surface-2);}
  tbody tr:last-child td{border-bottom:none;}
  .code{font-family:var(--mono);font-weight:600;font-size:13.5px;}
  .muted{color:var(--text-dim);} .when{white-space:nowrap;color:var(--text-dim);font-size:13px;}
  .evloc{color:var(--text-dim);font-size:12.5px;margin-top:2px;}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:12.5px;font-weight:600;color:#fff;white-space:nowrap;}
  .chip::before{content:"";width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.9);}
  .delivered{background:var(--c-delivered);} .returned{background:var(--c-returned);}
  .in_transit{background:var(--c-transit);} .out_for_delivery{background:var(--c-out);}
  .awaiting_pickup{background:var(--c-pickup);} .problem{background:var(--c-problem);}
  .registered{background:var(--c-reg);} .unknown{background:var(--c-unknown);}
  .bar{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden;min-width:70px;margin-top:5px;}
  .bar>span{display:block;height:100%;background:var(--c-transit);}
  .hist-toggle{cursor:pointer;color:var(--accent);font-size:12px;background:none;border:none;padding:5px 0 0;}
  .history{margin:8px 0 2px;padding:10px 12px;background:var(--surface-2);border-radius:8px;}
  .history ol{margin:0;padding-left:16px;} .history li{margin:3px 0;font-size:13px;}
  .history .h-when{color:var(--text-dim);}
  .seg{font-size:12.5px;white-space:nowrap;}
  .empty,.loading{text-align:center;color:var(--text-dim);padding:36px;}
  footer{text-align:center;color:var(--text-dim);font-size:12px;padding:24px;}
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="dot"></span><h1>Seguimento de Encomendas CTT</h1></div>
    <div class="meta">
      <span id="updated">a carregar…</span>
      <button class="btn add" id="add" title="Adicionar uma encomenda">＋ Adicionar</button>
      <button class="btn" id="reload" title="Recarregar da folha">↻ Recarregar</button>
      <button class="btn primary" id="fetch" title="Ir aos CTT buscar estados agora (mais lento)">Atualizar CTT</button>
    </div>
  </header>

  <div id="modal" class="modal" hidden>
    <div class="modal-box">
      <h2>Adicionar encomenda</h2>
      <label>Nº de objeto
        <input type="text" id="m-code" placeholder="ex.: RR123456789PT" autocomplete="off">
      </label>
      <label>Descrição (opcional)
        <input type="text" id="m-desc" placeholder="ex.: Cliente Sousa Lda">
      </label>
      <p class="m-msg" id="m-msg"></p>
      <div class="modal-actions">
        <button class="btn" id="m-cancel">Cancelar</button>
        <button class="btn primary" id="m-save">Adicionar</button>
      </div>
    </div>
  </div>
  <main>
    <section class="kpis" id="kpis"></section>
    <section class="controls">
      <input type="search" id="search" placeholder="Procurar por nº de objeto, descrição ou estado…">
      <div class="filters" id="filters"></div>
    </section>
    <section class="table-wrap">
      <table>
        <thead><tr>
          <th data-k="code">Objeto</th><th data-k="descricao">Descrição</th>
          <th data-k="estado">Estado</th><th>Último evento</th>
          <th>Progresso</th><th data-k="verificado">Verificado</th><th data-k="seguimento">Seguimento</th>
        </tr></thead>
        <tbody id="tbody"><tr><td colspan="7" class="loading">A carregar dados…</td></tr></tbody>
      </table>
    </section>
  </main>
  <footer>CTT_CFER · dashboard sobre a tua Google Sheet</footer>

<script>
  var LABELS={delivered:"Entregue",returned:"Devolvido",out_for_delivery:"Em distribuição",awaiting_pickup:"Aguarda levantamento",problem:"Problema",in_transit:"Em trânsito",registered:"Registado",unknown:"—"};
  var ORDER=["returned","problem","awaiting_pickup","out_for_delivery","in_transit","registered","delivered","unknown"];
  var ALL=[], filtro="all", termo="", sortK="estado", sortDir=1;

  function semAcento(s){return (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();}
  function categoria(estado){
    var s=semAcento(estado);
    if(!s) return "unknown";
    if(s.indexOf("devolv")===0||s.indexOf("devolv")>-1) return "returned";
    if(s.indexOf("entregue")>-1) return "delivered";
    if(s.indexOf("distribui")>-1||s.indexOf("em entrega")>-1) return "out_for_delivery";
    if(s.indexOf("levantamento")>-1) return "awaiting_pickup";
    if(s.indexOf("tentativa")>-1||s.indexOf("insucesso")>-1||s.indexOf("morada")>-1||s.indexOf("erro")>-1) return "problem";
    if(s.indexOf("transito")>-1||s.indexOf("expedid")>-1) return "in_transit";
    if(s.indexOf("aceite")>-1||s.indexOf("registad")>-1) return "registered";
    return "unknown";
  }
  function esc(s){return (s==null?"":String(s)).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];});}

  function carregar(){
    document.getElementById("updated").textContent="a carregar…";
    google.script.run.withSuccessHandler(function(d){
      ALL=(d&&d.parcels)||[];
      document.getElementById("updated").textContent="Atualizado: "+(d?d.geradoEm:"");
      render();
    }).withFailureHandler(function(e){
      document.getElementById("updated").textContent="Erro ao carregar";
      document.getElementById("tbody").innerHTML='<tr><td colspan="7" class="empty">Erro: '+esc(e&&e.message)+'</td></tr>';
    }).obterDados();
  }

  function contagens(){
    var c={all:ALL.length};
    ALL.forEach(function(p){var k=categoria(p.estado);c[k]=(c[k]||0)+1;});
    c.ativas=ALL.filter(function(p){return /ativa/i.test(p.seguimento);}).length;
    return c;
  }
  function renderKpis(){
    var c=contagens();
    var arr=[
      {l:"Total",n:c.all||0,cls:""},
      {l:"Em seguimento",n:c.ativas||0,cls:""},
      {l:"Devolvidos",n:c.returned||0,cls:c.returned?"alert":""},
      {l:"Entregues",n:c.delivered||0,cls:""},
      {l:"Em trânsito",n:(c.in_transit||0)+(c.out_for_delivery||0),cls:""},
      {l:"Problemas",n:c.problem||0,cls:c.problem?"alert":""}
    ];
    document.getElementById("kpis").innerHTML=arr.map(function(k){return '<div class="kpi '+k.cls+'"><div class="n">'+k.n+'</div><div class="l">'+k.l+'</div></div>';}).join("");
  }
  function renderFiltros(){
    var c=contagens(), cats=["all"].concat(ORDER.filter(function(x){return c[x];}));
    document.getElementById("filters").innerHTML=cats.map(function(cat){
      var label=cat==="all"?"Todos":LABELS[cat], n=cat==="all"?c.all:c[cat];
      return '<button data-cat="'+cat+'" class="'+(filtro===cat?"active":"")+'">'+label+" ("+n+")</button>";
    }).join("");
  }
  function filtrados(){
    var r=ALL.slice();
    if(filtro!=="all") r=r.filter(function(p){return categoria(p.estado)===filtro;});
    if(termo){var t=semAcento(termo);r=r.filter(function(p){return semAcento(p.code).indexOf(t)>-1||semAcento(p.descricao).indexOf(t)>-1||semAcento(p.estado).indexOf(t)>-1;});}
    r.sort(function(a,b){
      var av,bv;
      if(sortK==="estado"){av=ORDER.indexOf(categoria(a.estado));bv=ORDER.indexOf(categoria(b.estado));}
      else{av=semAcento(a[sortK]);bv=semAcento(b[sortK]);}
      return (av<bv?-1:av>bv?1:0)*sortDir;
    });
    return r;
  }
  function chip(p){var cat=categoria(p.estado);return '<span class="chip '+cat+'">'+esc(p.estado||LABELS[cat])+'</span>';}
  function barra(prog){var n=parseInt(prog,10);if(isNaN(n))return "";return '<div class="bar"><span style="width:'+Math.max(0,Math.min(100,n))+'%"></span></div>';}

  function renderTabela(){
    var rows=filtrados(), tb=document.getElementById("tbody");
    if(!rows.length){tb.innerHTML='<tr><td colspan="7" class="empty">Sem encomendas para mostrar.</td></tr>';return;}
    tb.innerHTML=rows.map(function(p,i){
      var h=p.historico||[];
      var hb=h.length>1?'<button class="hist-toggle" data-i="'+i+'">Ver histórico ('+h.length+')</button>':"";
      var hbk=h.length>1?'<div class="history" id="h'+i+'" hidden><ol>'+h.map(function(e){return "<li><span class='h-when'>"+esc(e.data)+"</span> — "+esc(e.evento||e.estado)+(e.local?" <span class='muted'>("+esc(e.local)+")</span>":"")+"</li>";}).join("")+"</ol></div>":"";
      return '<tr>'+
        '<td class="code">'+esc(p.code)+'</td>'+
        '<td>'+(esc(p.descricao)||'<span class="muted">—</span>')+'</td>'+
        '<td>'+chip(p)+'</td>'+
        '<td>'+esc(p.situacao||"—")+'<div class="evloc">'+esc(p.dataEvento||"")+(p.local?" · "+esc(p.local):"")+'</div>'+hb+hbk+'</td>'+
        '<td>'+esc(p.progresso||"")+barra(p.progresso)+'</td>'+
        '<td class="when">'+esc(p.verificado||"—")+'</td>'+
        '<td class="seg">'+esc(p.seguimento||"—")+'</td>'+
      '</tr>';
    }).join("");
    Array.prototype.forEach.call(tb.querySelectorAll(".hist-toggle"),function(b){
      b.addEventListener("click",function(){var el=document.getElementById("h"+b.dataset.i);el.hidden=!el.hidden;b.textContent=el.hidden?"Ver histórico ("+el.querySelectorAll("li").length+")":"Ocultar histórico";});
    });
  }
  function render(){renderKpis();renderFiltros();renderTabela();}

  document.getElementById("search").addEventListener("input",function(e){termo=e.target.value.trim();renderTabela();});
  document.getElementById("filters").addEventListener("click",function(e){var b=e.target.closest("button[data-cat]");if(!b)return;filtro=b.dataset.cat;renderFiltros();renderTabela();});
  Array.prototype.forEach.call(document.querySelectorAll("th[data-k]"),function(th){th.addEventListener("click",function(){var k=th.dataset.k;if(sortK===k)sortDir*=-1;else{sortK=k;sortDir=1;}renderTabela();});});
  // --- Modal "Adicionar encomenda" ---
  var modal=document.getElementById("modal");
  function abrirModal(){document.getElementById("m-code").value="";document.getElementById("m-desc").value="";var m=document.getElementById("m-msg");m.textContent="";m.className="m-msg";modal.hidden=false;document.getElementById("m-code").focus();}
  function fecharModal(){modal.hidden=true;}
  document.getElementById("add").addEventListener("click",abrirModal);
  document.getElementById("m-cancel").addEventListener("click",fecharModal);
  modal.addEventListener("click",function(e){if(e.target===modal)fecharModal();});
  function guardarNovo(){
    var code=document.getElementById("m-code").value.trim();
    var desc=document.getElementById("m-desc").value.trim();
    var msg=document.getElementById("m-msg");
    if(!code){msg.textContent="Escreve um número de objeto.";msg.className="m-msg err";return;}
    var save=document.getElementById("m-save");
    save.disabled=true;save.textContent="A adicionar…";
    msg.textContent="A consultar os CTT…";msg.className="m-msg";
    google.script.run.withSuccessHandler(function(r){
      save.disabled=false;save.textContent="Adicionar";
      if(r&&r.ok){fecharModal();carregar();}
      else{msg.textContent=(r&&r.msg)||"Não foi possível adicionar.";msg.className="m-msg err";}
    }).withFailureHandler(function(e){
      save.disabled=false;save.textContent="Adicionar";
      msg.textContent="Erro: "+(e&&e.message);msg.className="m-msg err";
    }).adicionarEncomenda(code,desc);
  }
  document.getElementById("m-save").addEventListener("click",guardarNovo);
  document.getElementById("m-code").addEventListener("keydown",function(e){if(e.key==="Enter")guardarNovo();});
  document.getElementById("m-desc").addEventListener("keydown",function(e){if(e.key==="Enter")guardarNovo();});

  document.getElementById("reload").addEventListener("click",carregar);
  document.getElementById("fetch").addEventListener("click",function(){
    var btn=this;btn.disabled=true;btn.textContent="A consultar CTT…";
    document.getElementById("updated").textContent="a consultar os CTT (pode demorar)…";
    google.script.run.withSuccessHandler(function(d){
      ALL=(d&&d.parcels)||[];document.getElementById("updated").textContent="Atualizado: "+(d?d.geradoEm:"");
      btn.disabled=false;btn.textContent="Atualizar CTT";render();
    }).withFailureHandler(function(e){
      btn.disabled=false;btn.textContent="Atualizar CTT";
      document.getElementById("updated").textContent="Erro: "+(e&&e.message);
    }).atualizarViaDashboard();
  });

  carregar();
</script>
</body>
</html>
