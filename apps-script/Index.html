<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    /* neutros (ardósia com ligeiro toque frio) */
    --bg:#f5f6f8; --surface:#ffffff; --surface-2:#f3f4f7; --surface-3:#eceef2;
    --border:#e5e7ec; --border-strong:#d6d9e0;
    --text:#14161c; --text-2:#3c424e; --text-dim:#727a88;
    --brand:#de0029; --brand-ink:#ffffff;
    /* estados: [texto] / [fundo suave] */
    --st-delivered:#067647; --st-delivered-bg:#e7f6ee;
    --st-returned:#b42318;  --st-returned-bg:#fdecea;
    --st-transit:#175cd3;   --st-transit-bg:#eaf2fe;
    --st-out:#6941c6;       --st-out-bg:#f1edfe;
    --st-pickup:#b54708;    --st-pickup-bg:#fdf3e7;
    --st-problem:#c4320a;   --st-problem-bg:#fdeee7;
    --st-reg:#475467;       --st-reg-bg:#eef0f3;
    --st-unknown:#727a88;   --st-unknown-bg:#eef0f3;
    --shadow-sm:0 1px 2px rgba(16,24,40,.05);
    --shadow:0 1px 3px rgba(16,24,40,.06), 0 6px 16px -8px rgba(16,24,40,.12);
    --shadow-lg:0 12px 40px -12px rgba(16,24,40,.28);
    --r-sm:8px; --r:12px; --r-lg:16px;
    --sans:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
  }
  :root[data-theme="dark"], :root:not([data-theme="light"]){}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0b0e13; --surface:#12161d; --surface-2:#171c25; --surface-3:#1e242e;
    --border:#242b36; --border-strong:#2f3745;
    --text:#e8ebf0; --text-2:#b7bfcc; --text-dim:#8b94a3;
    --brand:#ff4d63; --brand-ink:#0b0e13;
    --st-delivered:#4ade80; --st-delivered-bg:#0f2a1c;
    --st-returned:#ff8a80;  --st-returned-bg:#331414;
    --st-transit:#7fb3ff;   --st-transit-bg:#0f2036;
    --st-out:#c9b0ff;       --st-out-bg:#211a38;
    --st-pickup:#f6c667;    --st-pickup-bg:#2c2110;
    --st-problem:#ffa07a;   --st-problem-bg:#2f1a12;
    --st-reg:#a7b0bf;       --st-reg-bg:#1c222b;
    --st-unknown:#8b94a3;   --st-unknown-bg:#1c222b;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 1px 3px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.7);
    --shadow-lg:0 16px 48px -12px rgba(0,0,0,.75);
  }}
  :root[data-theme="dark"]{
    --bg:#0b0e13; --surface:#12161d; --surface-2:#171c25; --surface-3:#1e242e;
    --border:#242b36; --border-strong:#2f3745;
    --text:#e8ebf0; --text-2:#b7bfcc; --text-dim:#8b94a3;
    --brand:#ff4d63; --brand-ink:#0b0e13;
    --st-delivered:#4ade80; --st-delivered-bg:#0f2a1c;
    --st-returned:#ff8a80;  --st-returned-bg:#331414;
    --st-transit:#7fb3ff;   --st-transit-bg:#0f2036;
    --st-out:#c9b0ff;       --st-out-bg:#211a38;
    --st-pickup:#f6c667;    --st-pickup-bg:#2c2110;
    --st-problem:#ffa07a;   --st-problem-bg:#2f1a12;
    --st-reg:#a7b0bf;       --st-reg-bg:#1c222b;
    --st-unknown:#8b94a3;   --st-unknown-bg:#1c222b;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 1px 3px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.7);
    --shadow-lg:0 16px 48px -12px rgba(0,0,0,.75);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{font-family:var(--sans);font-size:14px;line-height:1.5;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
  h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.02em;}
  button{font-family:inherit;}
  a{color:inherit;}

  /* ---------- Cabeçalho ---------- */
  .header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(140%) blur(8px);border-bottom:1px solid var(--border);}
  .header-in{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:14px 28px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .logo{width:34px;height:34px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;font-size:15px;box-shadow:var(--shadow-sm);letter-spacing:-.03em;}
  .brand .t h1{font-size:16px;} .brand .t p{margin:1px 0 0;font-size:12px;color:var(--text-dim);}
  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .stamp{font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:6px;}
  .stamp .live{width:7px;height:7px;border-radius:50%;background:var(--st-delivered);box-shadow:0 0 0 3px var(--st-delivered-bg);}

  .btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text-2);border-radius:var(--r-sm);padding:8px 13px;font-size:13px;font-weight:550;cursor:pointer;transition:.15s;white-space:nowrap;}
  .btn:hover{background:var(--surface-2);color:var(--text);}
  .btn svg{width:15px;height:15px;}
  .btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);}
  .btn.primary:hover{filter:brightness(1.06);background:var(--brand);color:var(--brand-ink);}
  .btn.solid{background:var(--text);color:var(--surface);border-color:var(--text);}
  .btn.solid:hover{opacity:.9;background:var(--text);color:var(--surface);}
  .btn:disabled{opacity:.6;cursor:default;}

  main{padding:22px 28px 48px;}

  /* ---------- KPIs ---------- */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px;margin-bottom:22px;}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:10px;}
  .kpi .top{display:flex;align-items:center;justify-content:space-between;}
  .kpi .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;}
  .kpi .ic svg{width:18px;height:18px;}
  .kpi .n{font-size:28px;font-weight:720;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
  .kpi .l{font-size:12.5px;color:var(--text-dim);font-weight:500;}
  .kpi.alert{border-color:color-mix(in srgb,var(--st-returned) 45%,var(--border));}

  /* ---------- Barra de ferramentas ---------- */
  .controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
  .searchbox{position:relative;flex:1 1 300px;min-width:220px;}
  .searchbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-dim);}
  #search{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--surface);color:var(--text);font-size:14px;}
  #search:focus-visible{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent);}
  .segmented{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:4px;flex-wrap:wrap;}
  .segmented button{border:none;background:transparent;color:var(--text-dim);border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:550;cursor:pointer;transition:.15s;}
  .segmented button:hover{color:var(--text);}
  .segmented button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm);}
  .segmented button .c{opacity:.6;margin-left:2px;font-variant-numeric:tabular-nums;}

  /* ---------- Tabela ---------- */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;}
  .tscroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;min-width:900px;}
  thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);font-weight:600;padding:13px 18px;background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;}
  thead th.no-sort{cursor:default;}
  tbody td{padding:14px 18px;border-bottom:1px solid var(--border);vertical-align:top;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr{transition:background .12s;}
  tbody tr:hover{background:var(--surface-2);}
  .code{font-family:var(--mono);font-weight:600;font-size:13px;letter-spacing:-.01em;}
  .desc{color:var(--text-2);}
  .muted{color:var(--text-dim);}
  .evt{color:var(--text);} .evsub{color:var(--text-dim);font-size:12.5px;margin-top:3px;}
  .when{white-space:nowrap;color:var(--text-dim);font-size:12.5px;font-variant-numeric:tabular-nums;}

  .badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid transparent;}
  .badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
  .b-delivered{color:var(--st-delivered);background:var(--st-delivered-bg);}
  .b-returned{color:var(--st-returned);background:var(--st-returned-bg);}
  .b-in_transit{color:var(--st-transit);background:var(--st-transit-bg);}
  .b-out_for_delivery{color:var(--st-out);background:var(--st-out-bg);}
  .b-awaiting_pickup{color:var(--st-pickup);background:var(--st-pickup-bg);}
  .b-problem{color:var(--st-problem);background:var(--st-problem-bg);}
  .b-registered{color:var(--st-reg);background:var(--st-reg-bg);}
  .b-unknown{color:var(--st-unknown);background:var(--st-unknown-bg);}

  .seg-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:550;color:var(--text-2);}
  .prog{display:flex;align-items:center;gap:9px;min-width:120px;}
  .prog .val{font-size:12.5px;color:var(--text-2);font-variant-numeric:tabular-nums;width:34px;}
  .bar{flex:1;height:7px;border-radius:99px;background:var(--surface-3);overflow:hidden;}
  .bar>span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--st-transit),color-mix(in srgb,var(--st-transit) 70%,#7dd3fc));}

  .rowacts{display:flex;gap:6px;}
  .iconbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text-2);border-radius:var(--r-sm);padding:6px 10px;font-size:12px;font-weight:550;cursor:pointer;text-decoration:none;transition:.15s;white-space:nowrap;}
  .iconbtn:hover{background:var(--surface-2);color:var(--text);border-color:var(--brand);}
  .iconbtn svg{width:14px;height:14px;}

  .hist-toggle{margin-top:8px;display:inline-flex;align-items:center;gap:5px;cursor:pointer;color:var(--brand);font-size:12px;font-weight:550;background:none;border:none;padding:0;}
  .hist-toggle svg{width:12px;height:12px;transition:transform .15s;}
  .hist-toggle.open svg{transform:rotate(90deg);}
  .timeline{margin:10px 0 2px;padding-left:6px;border-left:2px solid var(--border);}
  .tl{position:relative;padding:0 0 10px 16px;}
  .tl:last-child{padding-bottom:0;}
  .tl::before{content:"";position:absolute;left:-7px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--border-strong);}
  .tl.first::before{border-color:var(--brand);background:var(--brand);}
  .tl .tw{font-size:12px;color:var(--text-dim);font-variant-numeric:tabular-nums;}
  .tl .te{font-size:13px;} .tl .tp{font-size:12px;color:var(--text-dim);}

  .state{padding:60px 20px;text-align:center;color:var(--text-dim);}
  .state svg{width:34px;height:34px;opacity:.5;margin-bottom:10px;}
  .spinner{width:22px;height:22px;border:2.5px solid var(--border-strong);border-top-color:var(--brand);border-radius:50%;display:inline-block;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  footer{text-align:center;color:var(--text-dim);font-size:12px;padding:26px;}

  /* ---------- Modal ---------- */
  .modal{position:fixed;inset:0;background:rgba(10,13,20,.55);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px;animation:fade .15s ease;}
  .modal[hidden]{display:none !important;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  .modal-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px;width:100%;max-width:440px;box-shadow:var(--shadow-lg);}
  .modal-box h2{font-size:18px;margin-bottom:4px;}
  .modal-box .sub{color:var(--text-dim);font-size:13px;margin:0 0 18px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:6px;}
  .field input{width:100%;padding:10px 12px;border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--bg);color:var(--text);font-size:14px;}
  .field input:focus-visible{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent);}
  .m-msg{min-height:18px;font-size:12.5px;margin:2px 0 14px;}
  .m-msg.err{color:var(--st-returned);} .m-msg.ok{color:var(--st-delivered);}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;}
</style>
</head>
<body>
  <header class="header">
    <div class="header-in">
      <div class="brand">
        <div class="logo">CTT</div>
        <div class="t"><h1>Seguimento de Encomendas</h1><p>Estado das entregas e devoluções em tempo real</p></div>
      </div>
      <div class="toolbar">
        <span class="stamp"><span class="live"></span><span id="updated">a carregar…</span></span>
        <button class="btn primary" id="add">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Adicionar
        </button>
        <button class="btn" id="reload" title="Recarregar da folha">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>Recarregar
        </button>
        <button class="btn solid" id="fetch" title="Ir aos CTT buscar os estados agora">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg>Atualizar CTT
        </button>
      </div>
    </div>
  </header>

  <div id="modal" class="modal" hidden>
    <div class="modal-box">
      <h2>Adicionar encomenda</h2>
      <p class="sub">Escreve o número do objeto. Vamos logo buscar o estado aos CTT.</p>
      <div class="field"><label>Nº de objeto</label><input type="text" id="m-code" placeholder="ex.: RR123456789PT" autocomplete="off"></div>
      <div class="field"><label>Descrição (opcional)</label><input type="text" id="m-desc" placeholder="ex.: Cliente Sousa Lda"></div>
      <p class="m-msg" id="m-msg"></p>
      <div class="modal-actions">
        <button class="btn" id="m-cancel">Cancelar</button>
        <button class="btn primary" id="m-save">Adicionar</button>
      </div>
    </div>
  </div>

  <main>
    <section class="kpis" id="kpis"></section>
    <section class="controls">
      <div class="searchbox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" id="search" placeholder="Procurar por nº de objeto, descrição ou estado…">
      </div>
      <div class="segmented" id="filters"></div>
    </section>
    <section class="card">
      <div class="tscroll">
        <table>
          <thead><tr>
            <th data-k="code">Objeto</th>
            <th data-k="descricao">Descrição</th>
            <th data-k="estado">Estado</th>
            <th class="no-sort">Último evento</th>
            <th class="no-sort">Progresso</th>
            <th data-k="verificado">Verificado</th>
            <th class="no-sort"></th>
          </tr></thead>
          <tbody id="tbody"><tr><td colspan="7" class="state"><span class="spinner"></span><div style="margin-top:10px">A carregar dados…</div></td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
  <footer>CTT · dashboard sobre a tua Google Sheet</footer>

<script>
  var LABELS={delivered:"Entregue",returned:"Devolvido",out_for_delivery:"Em distribuição",awaiting_pickup:"Aguarda levantamento",problem:"Problema",in_transit:"Em trânsito",registered:"Registado",unknown:"—"};
  var ORDER=["returned","problem","awaiting_pickup","out_for_delivery","in_transit","registered","delivered","unknown"];
  var ALL=[], filtro="all", termo="", sortK="estado", sortDir=1;

  function sa(s){return (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();}
  function categoria(estado){
    var s=sa(estado); if(!s) return "unknown";
    if(s.indexOf("devolv")>-1) return "returned";
    if(s.indexOf("entregue")>-1) return "delivered";
    if(s.indexOf("distribui")>-1||s.indexOf("em entrega")>-1) return "out_for_delivery";
    if(s.indexOf("levantamento")>-1) return "awaiting_pickup";
    if(s.indexOf("tentativa")>-1||s.indexOf("insucesso")>-1||s.indexOf("morada")>-1||s.indexOf("erro")>-1) return "problem";
    if(s.indexOf("transito")>-1||s.indexOf("expedid")>-1) return "in_transit";
    if(s.indexOf("aceite")>-1||s.indexOf("registad")>-1) return "registered";
    return "unknown";
  }
  function esc(s){return (s==null?"":String(s)).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];});}
  function cttUrl(code){return "https://appserver.ctt.pt/CustomerArea/PublicArea_Detail?ObjectCodeInput="+encodeURIComponent(code)+"&SearchInput="+encodeURIComponent(code);}
  function progNum(v){var n=parseFloat(String(v==null?"":v).replace("%","").replace(",","."));if(isNaN(n))return null;if(n<=1)n=n*100;return Math.round(n);}

  var ICON={
    box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m21 8-9-5-9 5v8l9 5 9-5V8z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></svg>',
    truck:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10 17V5H2v12M15 17H10M22 17h-2M14 9h4l3 3v5h-2"/><circle cx="7" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>',
    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
    back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-1"/></svg>',
    warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.3 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.3a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
    eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>'
  };
  var KPI_IC={total:ICON.box,ativas:ICON.truck,returned:ICON.back,delivered:ICON.check,transit:ICON.truck,problem:ICON.warn};

  function carregar(){
    setStamp("a carregar…");
    google.script.run.withSuccessHandler(function(d){
      ALL=(d&&d.parcels)||[]; setStamp("Atualizado "+(d?d.geradoEm:"")); render();
    }).withFailureHandler(function(e){
      setStamp("erro ao carregar");
      document.getElementById("tbody").innerHTML='<tr><td colspan="7" class="state">'+ICON.warn+'<div>Erro: '+esc(e&&e.message)+'</div></td></tr>';
    }).obterDados();
  }
  function setStamp(t){document.getElementById("updated").textContent=t;}

  function contagens(){
    var c={all:ALL.length};
    ALL.forEach(function(p){var k=categoria(p.estado);c[k]=(c[k]||0)+1;});
    c.ativas=ALL.filter(function(p){return /ativa/i.test(p.seguimento);}).length;
    return c;
  }
  function renderKpis(){
    var c=contagens();
    var arr=[
      {l:"Total",n:c.all||0,ic:KPI_IC.total,col:"--st-reg"},
      {l:"Em seguimento",n:c.ativas||0,ic:KPI_IC.ativas,col:"--st-transit"},
      {l:"Devolvidos",n:c.returned||0,ic:KPI_IC.returned,col:"--st-returned",alert:c.returned>0},
      {l:"Entregues",n:c.delivered||0,ic:KPI_IC.delivered,col:"--st-delivered"},
      {l:"Em trânsito",n:(c.in_transit||0)+(c.out_for_delivery||0),ic:KPI_IC.transit,col:"--st-out"},
      {l:"Problemas",n:c.problem||0,ic:KPI_IC.problem,col:"--st-problem",alert:c.problem>0}
    ];
    document.getElementById("kpis").innerHTML=arr.map(function(k){
      var bg="color-mix(in srgb, var("+k.col+") 14%, transparent)";
      return '<div class="kpi'+(k.alert?" alert":"")+'"><div class="top"><div class="n">'+k.n+'</div>'+
             '<div class="ic" style="background:'+bg+';color:var('+k.col+')">'+k.ic+'</div></div>'+
             '<div class="l">'+k.l+'</div></div>';
    }).join("");
  }
  function renderFiltros(){
    var c=contagens(), cats=["all"].concat(ORDER.filter(function(x){return c[x];}));
    document.getElementById("filters").innerHTML=cats.map(function(cat){
      var label=cat==="all"?"Todos":LABELS[cat], n=cat==="all"?c.all:c[cat];
      return '<button data-cat="'+cat+'" class="'+(filtro===cat?"active":"")+'">'+label+'<span class="c">'+n+'</span></button>';
    }).join("");
  }
  function filtrados(){
    var r=ALL.slice();
    if(filtro!=="all") r=r.filter(function(p){return categoria(p.estado)===filtro;});
    if(termo){var t=sa(termo);r=r.filter(function(p){return sa(p.code).indexOf(t)>-1||sa(p.descricao).indexOf(t)>-1||sa(p.estado).indexOf(t)>-1;});}
    r.sort(function(a,b){
      var av,bv;
      if(sortK==="estado"){av=ORDER.indexOf(categoria(a.estado));bv=ORDER.indexOf(categoria(b.estado));}
      else{av=sa(a[sortK]);bv=sa(b[sortK]);}
      return (av<bv?-1:av>bv?1:0)*sortDir;
    });
    return r;
  }
  function badge(p){var cat=categoria(p.estado);return '<span class="badge b-'+cat+'"><span class="dot"></span>'+esc(p.estado||LABELS[cat])+'</span>';}
  function progresso(v){var n=progNum(v);if(n==null)return '<span class="muted">—</span>';return '<div class="prog"><span class="val">'+n+'%</span><div class="bar"><span style="width:'+Math.max(0,Math.min(100,n))+'%"></span></div></div>';}

  function renderTabela(){
    var rows=filtrados(), tb=document.getElementById("tbody");
    if(!rows.length){tb.innerHTML='<tr><td colspan="7" class="state">'+ICON.box+'<div>Sem encomendas para mostrar.</div></td></tr>';return;}
    tb.innerHTML=rows.map(function(p,i){
      var h=p.historico||[];
      var hb=h.length>1?'<button class="hist-toggle" data-i="'+i+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>Histórico ('+h.length+')</button>':"";
      var tl=h.length>1?'<div class="timeline" id="h'+i+'" hidden>'+h.map(function(e,idx){return '<div class="tl'+(idx===0?" first":"")+'"><div class="tw">'+esc(e.data)+'</div><div class="te">'+esc(e.evento||e.estado)+'</div>'+(e.local?'<div class="tp">'+esc(e.local)+'</div>':"")+'</div>';}).join("")+'</div>':"";
      return '<tr>'+
        '<td><div class="code">'+esc(p.code)+'</div></td>'+
        '<td class="desc">'+(esc(p.descricao)||'<span class="muted">—</span>')+'</td>'+
        '<td>'+badge(p)+(p.seguimento?'<div class="seg-pill" style="margin-top:6px">'+esc(p.seguimento)+'</div>':"")+'</td>'+
        '<td><div class="evt">'+esc(p.situacao||"—")+'</div><div class="evsub">'+esc(p.dataEvento||"")+(p.local?" · "+esc(p.local):"")+'</div>'+hb+tl+'</td>'+
        '<td>'+progresso(p.progresso)+'</td>'+
        '<td class="when">'+esc(p.verificado||"—")+'</td>'+
        '<td><div class="rowacts"><a class="iconbtn" href="'+cttUrl(p.code)+'" target="_blank" rel="noopener noreferrer" title="Abrir no site dos CTT">'+ICON.eye+'CTT'+
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px"><path d="M7 17 17 7M8 7h9v9"/></svg></a></div></td>'+
      '</tr>';
    }).join("");
    Array.prototype.forEach.call(tb.querySelectorAll(".hist-toggle"),function(b){
      b.addEventListener("click",function(){var el=document.getElementById("h"+b.dataset.i);el.hidden=!el.hidden;b.classList.toggle("open",!el.hidden);});
    });
  }
  function render(){renderKpis();renderFiltros();renderTabela();}

  document.getElementById("search").addEventListener("input",function(e){termo=e.target.value.trim();renderTabela();});
  document.getElementById("filters").addEventListener("click",function(e){var b=e.target.closest("button[data-cat]");if(!b)return;filtro=b.dataset.cat;renderFiltros();renderTabela();});
  Array.prototype.forEach.call(document.querySelectorAll("th[data-k]"),function(th){th.addEventListener("click",function(){var k=th.dataset.k;if(sortK===k)sortDir*=-1;else{sortK=k;sortDir=1;}renderTabela();});});
  document.getElementById("reload").addEventListener("click",carregar);
  document.getElementById("fetch").addEventListener("click",function(){
    var btn=this;btn.disabled=true;setStamp("a consultar os CTT (pode demorar)…");
    google.script.run.withSuccessHandler(function(d){
      ALL=(d&&d.parcels)||[];setStamp("Atualizado "+(d?d.geradoEm:""));btn.disabled=false;render();
    }).withFailureHandler(function(e){btn.disabled=false;setStamp("erro: "+(e&&e.message));}).atualizarViaDashboard();
  });

  // Modal
  var modal=document.getElementById("modal");
  function abrirModal(){document.getElementById("m-code").value="";document.getElementById("m-desc").value="";var m=document.getElementById("m-msg");m.textContent="";m.className="m-msg";modal.hidden=false;document.getElementById("m-code").focus();}
  function fecharModal(){modal.hidden=true;}
  document.getElementById("add").addEventListener("click",abrirModal);
  document.getElementById("m-cancel").addEventListener("click",fecharModal);
  modal.addEventListener("click",function(e){if(e.target===modal)fecharModal();});
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!modal.hidden)fecharModal();});
  function guardarNovo(){
    var code=document.getElementById("m-code").value.trim();
    var desc=document.getElementById("m-desc").value.trim();
    var msg=document.getElementById("m-msg");
    if(!code){msg.textContent="Escreve um número de objeto.";msg.className="m-msg err";return;}
    var save=document.getElementById("m-save");save.disabled=true;save.textContent="A adicionar…";
    msg.textContent="A consultar os CTT…";msg.className="m-msg";
    google.script.run.withSuccessHandler(function(r){
      save.disabled=false;save.textContent="Adicionar";
      if(r&&r.ok){fecharModal();carregar();}
      else{msg.textContent=(r&&r.msg)||"Não foi possível adicionar.";msg.className="m-msg err";}
    }).withFailureHandler(function(e){
      save.disabled=false;save.textContent="Adicionar";
      msg.textContent="Erro: "+(e&&e.message);msg.className="m-msg err";
    }).adicionarEncomenda(code,desc);
  }
  document.getElementById("m-save").addEventListener("click",guardarNovo);
  document.getElementById("m-code").addEventListener("keydown",function(e){if(e.key==="Enter")guardarNovo();});
  document.getElementById("m-desc").addEventListener("keydown",function(e){if(e.key==="Enter")guardarNovo();});

  carregar();
</script>
</body>
</html>
