name: Atualização diária CTT

on:
  schedule:
    # Todos os dias às 07:00 UTC (08:00 em Portugal continental no inverno,
    # 08:00/09:00 conforme horário de verão). Ajusta à vontade.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      method:
        description: "Estratégia de recolha"
        required: false
        default: "auto"
        type: choice
        options: [auto, playwright, http]

permissions:
  contents: write

concurrency:
  group: ctt-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chromium (Playwright)
        run: python -m playwright install --with-deps chromium

      - name: Atualizar estados
        env:
          CTT_DEBUG: "1"   # guarda dumps em debug/ para diagnóstico
        run: python -m tracker.update --method "${{ github.event.inputs.method || 'auto' }}"

      - name: Guardar artefactos de debug (se houver)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctt-debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit das mudanças de estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/parcels.json docs/data.json
          if git diff --staged --quiet; then
            echo "Sem alterações de estado."
          else
            git commit -m "chore: atualização automática de estados CTT [skip ci]"
            git push
          fi
